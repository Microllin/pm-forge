name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 格式 · 检查 · 类型 · 测试 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: 代码检查
        run: pnpm lint

      - name: 类型检查
        run: pnpm typecheck

      # 页面快照 / 只读浏览相关用例要真浏览器。GitHub 的 Ubuntu 机器自带 Google Chrome，
      # 直接指过去，不用每次下载 Chromium。
      - name: 确认浏览器
        run: google-chrome --version

      - name: 单元测试
        run: pnpm test
        env:
          PMFORGE_CHROMIUM: /usr/bin/google-chrome

      - name: 构建
        run: pnpm build
